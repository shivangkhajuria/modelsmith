[project]
name = "modelsmith"
version = "0.1.0"
description = "An agent that designs, trains, evaluates and explains ML models from a CSV and a plain-English goal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shivang Khajuria" }]
dependencies = [
    "anthropic>=1.1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
]

[project.scripts]
modelsmith = "modelsmith.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
